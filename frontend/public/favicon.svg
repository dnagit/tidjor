<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <clipPath id="bar"><rect x="12" y="13.5" width="40" height="12" rx="2.5"/></clipPath>
  </defs>

  <!-- พื้นหลังสี่เหลี่ยมมุมโค้ง สีแบรนด์ -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- ตัวกระดานสเลท (clapperboard body) -->
  <rect x="13" y="27" width="38" height="24" rx="3.5" fill="#ffffff"/>

  <!-- แถบไม้ตีด้านบน (เอียงเล็กน้อย) + ลายทแยง -->
  <g transform="rotate(-9 32 20)">
    <rect x="12" y="13.5" width="40" height="12" rx="2.5" fill="#ffffff"/>
    <g clip-path="url(#bar)" fill="#D97706">
      <polygon points="18,12 25,12 19,27 12,27"/>
      <polygon points="30,12 37,12 31,27 24,27"/>
      <polygon points="42,12 49,12 43,27 36,27"/>
    </g>
  </g>
</svg>
